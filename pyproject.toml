[project]
name = "iris-flower-prediction"
version = "0.1.0"
description = "Streamlit application for predicting Iris species"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.66.1",
    "pandas>=3.1.0",
    "numpy>=2.4.0",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.0",
    "Pillow>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []
